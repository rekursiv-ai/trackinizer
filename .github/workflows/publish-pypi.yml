name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish package to PyPI
    runs-on: ubuntu-latest
    # Bounded so a hung publish fails in minutes, not at the 6h default.
    timeout-minutes: 20
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The wheel ships the web app's build (`artifacts` in pyproject.toml), which
      # a wheel built first would silently leave out. web/npm runs npm on the
      # Node that the test group installs.
      - name: Build the web app
        run: cd trackinizer/web && ./npm ci --no-audit --no-fund && ./npm run build

      - name: Build package
        run: uv build --out-dir dist

      - name: Validate built package
        run: |
          uv run python -c "import trackinizer; print(trackinizer.__file__)"
          uv run python -m zipfile -l dist/trackinizer-*.whl | grep -q trackinizer/web/dist/index.html

      # Resolve the wheel against PyPI alone -- a symbol that exists only on
      # treekle main fails HERE, before an irreversible upload, instead of in a
      # user's `pip install`. Twice: the base wheel is the client side and must
      # pull none of the server's packages; the `server` extra carries torch, so
      # the CPU index keeps the CUDA build (about 2.5 GB) off the runner's disk
      # while every other dependency still resolves from PyPI. `--no-project`
      # keeps the checkout out of both environments.
      - name: Validate against published dependencies
        run: |
          wheels=(dist/trackinizer-*.whl)
          uv run --isolated --no-project --with "${wheels[0]}" python -P -c "import importlib.util, trackinizer.trax.cli, trackinizer.client.client; assert not any(importlib.util.find_spec(name) for name in ('torch', 'fastapi', 'asyncpg'))"
          uv run --isolated --no-project --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match --with "${wheels[0]}[server]" python -P -c "import trackinizer.server.server"

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
