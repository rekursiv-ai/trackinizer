<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Trackinizer</title>
<style>
  :root {
    --bg: #1a1b26;
    --bg-row: #24283b;
    --fg: #c0caf5;
    --muted: #565f89;
    --line: #3b4261;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 13px/1.4 ui-monospace, "SF Mono", "Cascadia Code",
          "Fira Code", "JetBrains Mono", Menlo, monospace;
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--bg-row); border: 1px solid var(--line);
    border-radius: 4px; padding: 32px; min-width: 320px; text-align: center;
  }
  h1 { color: var(--accent); margin: 0 0 8px; font-size: 18px; }
  p { color: var(--muted); margin: 0 0 24px; font-size: 12px; }
  a.button {
    display: inline-block;
    background: var(--accent); color: var(--bg);
    border: 1px solid var(--accent); border-radius: 3px;
    padding: 8px 18px; font: inherit; font-weight: bold;
    text-decoration: none;
  }
  a.button:hover { filter: brightness(1.1); }
  .nextnote { color: var(--muted); font-size: 11px; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Trackinizer</h1>
  <p>Sign in to continue.</p>
  <a id="signin" class="button" href="/auth/login">Sign in with Google</a>
  <div class="nextnote" id="nextnote"></div>
</div>
<script>
  // Forward ``?next=`` from the address bar onto the OAuth start URL so
  // the user lands on the page they originally asked for, not on ``/``.
  const params = new URLSearchParams(location.search);
  const next = params.get("next");
  const btn = document.getElementById("signin");
  if (next && next.startsWith("/")) {
    btn.href = `/auth/login?next=${encodeURIComponent(next)}`;
    document.getElementById("nextnote").textContent = `After sign-in: ${next}`;
  }
</script>
</body>
</html>
