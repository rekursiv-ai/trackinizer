  try {
    await Api.purge(id, currentAuthor(), reason);
    toast(`purged ${kind}`);
    location.hash = "#/recent";
  } catch (err) {
    toast(err.message, true);
  }
}

// ---- Submit forms ----------------------------------------------------------

function viewSubmit(kind) {
  const schema = SUBMIT_SCHEMAS[kind];
  if (!schema) {
    setMain(el("div", { class: "empty" }, `unknown kind: ${kind}`));
    return;
  }
  const form = el("form", { class: "submit-form", onsubmit: (e) => { e.preventDefault(); submitForm(kind, form); } });
  form.appendChild(el("h2", {}, `New ${kind}`));

  addInput(form, "title", "title (required)", { required: true });
  addInput(form, "description", "description (markdown)", { multiline: true });
  addInput(form, "labels", "labels", { hint: "comma-separated" });
  addInput(form, "owner", "owner", { hint: "agent id; defaults to your shell user" });
  for (const ex of schema.extras) {
    if (ex.type === "select") {
      const sel = el("select", { name: ex.name });
      for (const opt of ex.options) {
        const o = el("option", { value: opt }, opt);
        if (opt === ex.default) o.setAttribute("selected", "");
        sel.appendChild(o);
      }
      form.appendChild(el("label", {}, ex.label));
      form.appendChild(sel);
    } else if (ex.type === "multi-select") {
      form.appendChild(el("label", {}, ex.label));
      const sel = el("select", { name: ex.name, multiple: true });
      for (const opt of ex.options) {
        const o = el("option", { value: opt }, opt);
        if ((ex.default || []).includes(opt)) o.setAttribute("selected", "");
        sel.appendChild(o);
      }
      form.appendChild(sel);
    } else if (ex.multiline) {
      form.appendChild(el("label", {}, ex.label));
      form.appendChild(el("textarea", { name: ex.name }));
    } else {
      addInput(form, ex.name, ex.label, { hint: ex.hint, required: ex.required });
    }
  }
  form.appendChild(el("button", { type: "submit", class: "submit" }, `Submit ${kind}`));
  setMain(form);
}

function addInput(form, name, label, opts = {}) {
  form.appendChild(el("label", {}, label));
  const input = opts.multiline
    ? el("textarea", { name })
    : el("input", { type: "text", name });
  if (opts.required) input.setAttribute("required", "");
  form.appendChild(input);
  if (opts.hint) form.appendChild(el("div", { class: "hint" }, opts.hint));
}

async function submitForm(kind, form) {
  const data = new FormData(form);
  const body = {
    title: data.get("title"),
    description: data.get("description") || "",
    owner: data.get("owner") || "",
    actor: currentAuthor(),
  };
  const labels = (data.get("labels") || "").toString();
  body.labels = labels.split(",").map(s => s.trim()).filter(Boolean);

  const schema = SUBMIT_SCHEMAS[kind];
  for (const ex of schema.extras) {
    const raw = (data.get(ex.name) || "").toString();
    if (ex.type === "typed-refs") {
      try {
        // Belief citation inline-refs are (id, kind, valence); a positive
        // default (+0.5) means "proves/favors". For-vs-against is the sign.
        body[ex.name] = (await resolveRefList(raw)).map(r => [r.id, r.kind, 0.5]);
      } catch (err) {
        toast(`${ex.name}: ${err.message}`, true);
        return;
      }
    } else if (ex.type === "narrows") {
      body[ex.name] = raw.split(",").map(s => s.trim()).filter(Boolean).map(id => [id, null]);
    } else if (ex.type === "uuids" || ex.type === "strings") {
      // Comma-separated list -> array of strings (UUIDs for `uuids`, free text
      // for `strings`, e.g. Paper authors which the server stores as a list).
      body[ex.name] = raw.split(",").map(s => s.trim()).filter(Boolean);
    } else if (ex.type === "multi-select") {
      body[ex.name] = data.getAll(ex.name).map(v => v.toString());
    } else if (ex.type === "integer") {
      body[ex.name] = raw ? parseInt(raw, 10) : ex.default;
    } else if (ex.type === "float") {
      body[ex.name] = raw ? parseFloat(raw) : ex.default;
    } else if (ex.type === "select") {
      body[ex.name] = raw || ex.default;
    } else {
      body[ex.name] = raw;
    }
  }
  try {
    const out = await Api.submit(kind, body);
    toast(`created ${kind}: ${out.id}`);
    location.hash = `#/inquiry/${out.id}`;
  } catch (err) {
    toast(err.message, true);
  }
}

// ---- Search ----------------------------------------------------------------

async function viewSearch(query) {
  setMain(el("h2", {}, `Search: ${query}`));
  if (!query) {
    setMain(el("h2", {}, "Search"), el("div", { class: "empty" }, "enter a query above"));
    return;
  }
  try {
    const rows = await Api.search(query);
    if (rows.length === 0) {
      setMain(el("h2", {}, `Search: ${query}`), el("div", { class: "empty" }, "no matches"));
      return;
    }
    const table = el("table");
    table.appendChild(el("thead", {}, el("tr", {},
      ...["Ref", "Status", "Title"].map(h => el("th", {}, h)))));
    const tbody = el("tbody");
    for (const r of rows) {
      tbody.appendChild(el("tr", {},
        el("td", { class: "ref" }, refLink(r.kind, r.id, r.seq, r.title)),
        el("td", {}, statusPill(r.status)),
        el("td", {}, r.title || ""),
      ));
    }
    table.appendChild(tbody);
    setMain(el("h2", {}, `Search: ${query} (${rows.length})`), table);
  } catch (err) {
    setMain(errBanner(err.message));
  }
}

async function viewLookup(uuidish) {
  setMain(el("h2", {}, "Looking up..."));
  try {
    const r = await Api.lookup(uuidish);
    location.hash = `#/inquiry/${r.id}`;
  } catch (err) {
    setMain(errBanner(err.message));
  }
}

// Resolve a short-ref (`#/ref/Belief/45`) to its inquiry and redirect. Used by
// the description linkifier; a missing ref shows the same error banner as a bad
// UUID lookup rather than a broken navigation.
async function viewRef(kind, seq) {
  setMain(el("h2", {}, "Looking up..."));
  try {
    const { id } = await resolveRef(`${kind}#${seq}`);
    location.hash = `#/inquiry/${id}`;
  } catch (err) {
    setMain(errBanner(err.message));
  }
}

// ---- Router ----------------------------------------------------------------

function parseHash() {
  const raw = (location.hash || "#/recent").replace(/^#\//, "");
  const [path, q] = raw.split("?");
  const params = new URLSearchParams(q || "");
  return { path: path.split("/"), params };
}

function route() {
  closeModal();
  const { path, params } = parseHash();
  switch (path[0]) {
    case "":
    case "recent":
      viewRecent(); break;
    case "list":
      viewList(path[1] || "Issue"); break;
    case "inquiry":
      viewInquiry(path[1]); break;
    case "new":
      viewSubmit(path[1] || "Issue"); break;
    case "search":
      viewSearch(params.get("q") || ""); break;
    case "lookup":
      viewLookup(path[1]); break;
    case "ref":
      viewRef(path[1], path[2]); break;
    default:
      viewRecent();
  }
}

// ---- Boot ------------------------------------------------------------------

function buildPickers() {
  const kindPicker = document.getElementById("kind-picker");
  const newPicker = document.getElementById("new-picker");
  for (const k of ALL_KINDS) {
    kindPicker.appendChild(el("option", { value: k }, k));
    if (!VIEW_ONLY_KINDS.has(k)) {
      newPicker.appendChild(el("option", { value: k }, `New ${k}`));
    }
  }
  kindPicker.addEventListener("change", e => {
    if (e.target.value) location.hash = `#/list/${e.target.value}`;
    e.target.selectedIndex = 0;
  });
  newPicker.addEventListener("change", e => {
    if (e.target.value) location.hash = `#/new/${e.target.value}`;
    e.target.selectedIndex = 0;
  });
}

function buildSearch() {
  const search = document.getElementById("search-box");
  search.addEventListener("keypress", e => {
    if (e.key === "Enter") {
      location.hash = `#/search?q=${encodeURIComponent(search.value)}`;
    }
  });
}

function startSse() {
  // Native EventSource auto-reconnects on transient errors; only abort on
  // the terminal CLOSED state. Calling sse.close() on every error -- as
  // the original code did -- disabled recovery entirely and left the UI
  // stale after the first hiccup.
  const sse = new EventSource("/api/web/subscribe");
  sse.onmessage = (e) => {
    let payload;
    try {
      payload = JSON.parse(e.data);
    } catch (_) {
      return;
    }
    const { path } = parseHash();
    if (path[0] === "inquiry" && path[1] === payload.id) {
      viewInquiry(payload.id);
    } else if (path[0] === "list") {
      viewList(path[1] || "Issue");
    } else if (path[0] === "recent" || path[0] === "" || !path[0]) {
      viewRecent();
    }
  };
  sse.onerror = () => {
    if (sse.readyState === EventSource.CLOSED) {
      console.warn("SSE permanently closed");
    }
  };
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

document.getElementById("home").addEventListener("click", () => { location.hash = "#/recent"; });
document.getElementById("recent-btn").addEventListener("click", () => { location.hash = "#/recent"; });
window.addEventListener("hashchange", route);

document.getElementById("user-nav-logout").addEventListener("click", async (e) => {
  e.preventDefault();
  try { await fetch("/auth/logout", { method: "POST", credentials: "same-origin" }); } catch (_) {}
  location.href = "/auth/login_page";
});

(async () => {
  try {
    const r = await fetch("/api/me/profile", { credentials: "same-origin" });
    if (!r.ok) return;
    const me = await r.json();
    if (me && me.role === "admin") {
      document.getElementById("user-nav-admin").style.display = "";
    }
  } catch (_) { /* ignore */ }
})();

buildPickers();
buildSearch();
route();
startSse();

</script>
