<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0b" />
    <script>try{const t=localStorage.getItem("trackinizer.theme");if(t==="light"||(t==="system"&&!matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.dataset.theme="light";document.querySelector('meta[name="theme-color"]').content="#edf1f5"}}catch{}</script>
    <meta
      name="description"
      content="Trackinizer: issues, beliefs, papers, experiments and agent sessions as one graph, updated live."
    />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <title>Trackinizer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
